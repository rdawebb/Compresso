name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install C libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libarchive-dev \
            libzip-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libsnappy-dev

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

  # Build C libraries for the Windows test job
  vcpkg-windows:
    name: Build C libraries (Windows)
    runs-on: windows-latest
    env:
      # Release-only; the default x64-windows triplet also builds debug, which
      # doubles the build for artifacts the extension never links against
      VCPKG_DEFAULT_TRIPLET: x64-windows-release
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      # Archives are keyed by each port's ABI hash & rebuilt on mismatch
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prefix-only lookup restores the newest archive set; the save below is
      # keyed on its contents, so a new entry is written only when a port rebuilt
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-${{ env.VCPKG_DEFAULT_TRIPLET }}-
          restore-keys: vcpkg-bincache-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: Create vcpkg binary cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path vcpkg_bincache | Out-Null

      - name: Install C libraries (Windows)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          runVcpkgInstall: true
          runVcpkgFormatString: "[`install`, `--recurse`, `--clean-after-build`, `--x-install-root`, `$[env.VCPKG_INSTALLED_DIR]`, `--triplet`, `$[env.VCPKG_DEFAULT_TRIPLET]`]"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-matched-key != format('vcpkg-bincache-{0}-{1}', env.VCPKG_DEFAULT_TRIPLET, hashFiles('vcpkg_bincache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('vcpkg_bincache/**') }}

      - name: Show installed tree
        shell: pwsh
        run: Get-ChildItem -Name "vcpkg_installed\x64-windows-release"

      - name: Pack C libraries
        shell: pwsh
        run: tar -czf vcpkg-installed.tgz -C vcpkg_installed x64-windows-release

      - name: Upload C libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-x64-windows-release
          path: vcpkg-installed.tgz
          retention-days: 1

  # Every Python version on Linux, 3.14 elsewhere; entries with sanitize set
  # also run the C tests
  tests:
    name: Run all tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - { os: ubuntu-latest, python: "3.14", sanitize: "address,undefined" }
          - { os: macos-latest, python: "3.14", sanitize: none }
          - { os: macos-15-intel, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install C libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libarchive-dev \
            libzip-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libsnappy-dev

      - name: Install C libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libarchive libzip zstd lz4 snappy xz
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}

      # Also builds the extension, as an editable install of the project; only
      # CI treats warnings as errors, so a newer compiler can't break user builds
      - name: Sync dependencies
        run: uv sync --all-extras --config-settings-package compresso:setup-args=-Dwerror=true

      - name: Run Python tests
        run: uv run pytest -n auto

      # Linux runs sanitised only, as the sync above covers its plain -Werror build
      # UBSan only reports by default, so it's made to fail the test; leak checking is off
      # because the embedded interpreter never frees everything
      - name: Run C tests
        if: matrix.sanitize
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          uv run meson setup build/c-tests tests/c -Dwerror=true -Db_sanitize=${{ matrix.sanitize }}
          uv run meson test -C build/c-tests --print-errorlogs

  test-python-windows:
    name: Python tests (windows-latest, py3.14)
    runs-on: windows-latest
    needs: vcpkg-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download C libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vcpkg-x64-windows-release
          path: ${{ runner.temp }}/vcpkg-artifact

      - name: Unpack C libraries
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\vcpkg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          tar -xzf "$env:RUNNER_TEMP\vcpkg-artifact\vcpkg-installed.tgz" -C $dest
          $root = "$dest\x64-windows-release"
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
          "COMPRESSO_VCPKG_BIN_DIR=$root\bin" >> $env:GITHUB_ENV
          # The pkgconf wheel from the dev extra
          "PKG_CONFIG=$env:GITHUB_WORKSPACE\.venv\Scripts\pkgconf.exe" >> $env:GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      # Also builds the extension, as an editable install of the project
      - name: Sync dependencies
        run: uv sync --all-extras

      # The editable install leaves the extension in its build dir, not src\
      - name: Bundle dependent DLLs next to the extension
        shell: pwsh
        run: |
          $pyd = Get-ChildItem build -Recurse -File -Filter "_core*.pyd" | Select-Object -First 1
          if (-not $pyd) { throw "No built _core*.pyd under build\" }
          Copy-Item "$env:COMPRESSO_VCPKG_BIN_DIR\*.dll" $pyd.DirectoryName -Force

      - name: Run Python tests
        run: uv run pytest -n auto
