name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install C libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libarchive-dev \
            libzip-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libsnappy-dev

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

  # Build C libraries once for use by the Windows test matrix
  vcpkg-windows:
    name: Build C libraries (Windows)
    runs-on: windows-latest
    env:
      # Release-only; the default x64-windows triplet also builds debug, which
      # doubles the build for artifacts the extension never links against
      VCPKG_DEFAULT_TRIPLET: x64-windows-release
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      # Archives are keyed by each port's ABI hash & rebuilt on mismatch
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite
    steps:
      - uses: actions/checkout@v7

      # Prefix-only lookup restores the newest archive set; the save below is
      # keyed on its contents, so a new entry is written only when a port rebuilt
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-${{ env.VCPKG_DEFAULT_TRIPLET }}-
          restore-keys: vcpkg-bincache-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: Create vcpkg binary cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path vcpkg_bincache | Out-Null

      - name: Install C libraries (Windows)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          runVcpkgInstall: true
          runVcpkgFormatString: "[`install`, `--recurse`, `--clean-after-build`, `--x-install-root`, `$[env.VCPKG_INSTALLED_DIR]`, `--triplet`, `$[env.VCPKG_DEFAULT_TRIPLET]`]"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-matched-key != format('vcpkg-bincache-{0}-{1}', env.VCPKG_DEFAULT_TRIPLET, hashFiles('vcpkg_bincache/**'))
        uses: actions/cache/save@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('vcpkg_bincache/**') }}

      - name: Show installed tree
        shell: pwsh
        run: Get-ChildItem -Name "vcpkg_installed\x64-windows-release"

      - name: Pack C libraries
        shell: pwsh
        run: tar -czf vcpkg-installed.tgz -C vcpkg_installed x64-windows-release

      - name: Upload C libraries
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-x64-windows-release
          path: vcpkg-installed.tgz
          retention-days: 1

  test-python:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install C libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libarchive-dev \
            libzip-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libsnappy-dev

      - name: Install C libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libarchive libzip zstd lz4 snappy xz
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python }}

      # Also builds the extension, as an editable install of the project; only
      # CI treats warnings as errors, so a newer compiler can't break user builds
      - name: Sync dependencies
        run: uv sync --all-extras --config-settings-package compresso:setup-args=-Dwerror=true

      - name: Run Python tests
        run: uv run pytest -n auto

  test-python-windows:
    name: Python tests (windows-latest, py${{ matrix.python }})
    runs-on: windows-latest
    needs: vcpkg-windows
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Download C libraries
        uses: actions/download-artifact@v8
        with:
          name: vcpkg-x64-windows-release
          path: ${{ runner.temp }}/vcpkg-artifact

      - name: Unpack C libraries
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\vcpkg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          tar -xzf "$env:RUNNER_TEMP\vcpkg-artifact\vcpkg-installed.tgz" -C $dest
          $root = "$dest\x64-windows-release"
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
          "COMPRESSO_VCPKG_BIN_DIR=$root\bin" >> $env:GITHUB_ENV
          # The pkgconf wheel from the dev extra
          "PKG_CONFIG=$env:GITHUB_WORKSPACE\.venv\Scripts\pkgconf.exe" >> $env:GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python }}

      # Also builds the extension, as an editable install of the project
      - name: Sync dependencies
        run: uv sync --all-extras

      # The editable install leaves the extension in its build dir, not src\
      - name: Bundle dependent DLLs next to the extension
        shell: pwsh
        run: |
          $pyd = Get-ChildItem build -Recurse -File -Filter "_core*.pyd" | Select-Object -First 1
          if (-not $pyd) { throw "No built _core*.pyd under build\" }
          Copy-Item "$env:COMPRESSO_VCPKG_BIN_DIR\*.dll" $pyd.DirectoryName -Force

      - name: Run Python tests
        run: uv run pytest -n auto

  # Windows is intentionally absent; the sources under test are portable and
  # are exercised on Windows through the extension by test-python-windows
  test-c:
    name: C tests (${{ matrix.os }}${{ matrix.sanitize != 'none' && format(', {0}', matrix.sanitize) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitize: [none]
        include:
          - os: ubuntu-latest
            sanitize: address,undefined
    steps:
      - uses: actions/checkout@v7

      - name: Install C libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libsnappy-dev

      - name: Install C libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd lz4 snappy xz

      # The Unity harness embeds the interpreter Meson runs under, so
      # actions/setup-python ships a linkable libpython plus dev headers
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Ruby, which generates the Unity runners, is preinstalled on both runners
      - name: Install Meson
        run: python -m pip install "meson>=1.3.0,<1.13.0" "ninja>=1.11.1,<1.14.0"

      - name: Configure C tests
        run: meson setup build/c-tests tests/c -Dwerror=true -Db_sanitize=${{ matrix.sanitize }}

      # UBSan only reports by default, so it's made to fail the test; leak
      # checking is off because the embedded interpreter never frees everything
      - name: Run C tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: meson test -C build/c-tests --print-errorlogs

  fuzz:
    name: Fuzz (ubuntu-latest, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the targets in tests/c/meson.build
        target: [gzip, bzip2, xz, zstd, lz4, detect, gzip_name]
    steps:
      - uses: actions/checkout@v7

      # libFuzzer's runtime ships in the compiler-rt package matching clang's
      # major version, not with clang itself
      - name: Install C libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libsnappy-dev \
            "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Meson
        run: python -m pip install "meson>=1.3.0,<1.13.0" "ninja>=1.11.1,<1.14.0"

      - name: Build fuzz target
        env:
          CC: clang
        run: |
          meson setup build/c-fuzz tests/c -Dfuzz=true -Dwerror=true -Db_sanitize=address,undefined
          meson compile -C build/c-fuzz fuzz_${{ matrix.target }}

      # Prefix-only lookup restores the newest corpus, so coverage accumulates
      # across runs; only main saves, since PRs can read main's caches, but not
      # each other's
      - name: Restore fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # A per-input timeout, since -max_total_time alone never reports a hang;
      # PYTHONMALLOC=malloc lets the per-input leak check see leaked PyObjects;
      # the exit check only sees the harness's never-finalised interpreter
      - name: Run fuzz target
        env:
          PYTHONMALLOC: malloc
          ASAN_OPTIONS: leak_check_at_exit=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p build/fuzz-artifacts build/fuzz-corpus
          build/c-fuzz/fuzz_${{ matrix.target }} -max_total_time=60 -timeout=10 \
            -artifact_prefix=build/fuzz-artifacts/fuzz_${{ matrix.target }}- \
            build/fuzz-corpus tests/fixtures/interop

      # Also after a crash, so that run's progress isn't lost
      - name: Save fuzz corpus
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: build/fuzz-artifacts
