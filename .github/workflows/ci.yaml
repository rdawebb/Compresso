name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install C libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libarchive-dev \
            libzip-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libsnappy-dev

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check src tests

  # Build C libraries once for use by the Windows test matrix
  vcpkg-windows:
    name: Build C libraries (Windows)
    runs-on: windows-latest
    env:
      # Release-only; the default x64-windows triplet also builds debug, which
      # doubles the build for artifacts the extension never links against
      VCPKG_DEFAULT_TRIPLET: x64-windows-release
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
    steps:
      - uses: actions/checkout@v7

      - name: Install C libraries (Windows)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          runVcpkgInstall: true
          runVcpkgFormatString: "[`install`, `--recurse`, `--clean-after-build`, `--x-install-root`, `$[env.VCPKG_INSTALLED_DIR]`, `--triplet`, `$[env.VCPKG_DEFAULT_TRIPLET]`]"

      - name: Show installed tree
        shell: pwsh
        run: Get-ChildItem -Name "vcpkg_installed\x64-windows-release"

      - name: Pack C libraries
        shell: pwsh
        run: tar -czf vcpkg-installed.tgz -C vcpkg_installed x64-windows-release

      - name: Upload C libraries
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-x64-windows-release
          path: vcpkg-installed.tgz
          retention-days: 1

  test-python:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install C libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libarchive-dev \
            libzip-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libsnappy-dev

      - name: Install C libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libarchive libzip zstd lz4 snappy xz
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Build extension
        run: uv pip install -e .

      - name: Run Python tests
        run: uv run pytest

  test-python-windows:
    name: Python tests (windows-latest, py${{ matrix.python }})
    runs-on: windows-latest
    needs: vcpkg-windows
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Download C libraries
        uses: actions/download-artifact@v8
        with:
          name: vcpkg-x64-windows-release
          path: ${{ runner.temp }}/vcpkg-artifact

      - name: Unpack C libraries
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\vcpkg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          tar -xzf "$env:RUNNER_TEMP\vcpkg-artifact\vcpkg-installed.tgz" -C $dest
          $root = "$dest\x64-windows-release"
          "COMPRESSO_EXTRA_INCLUDE_DIRS=$root\include" >> $env:GITHUB_ENV
          "COMPRESSO_EXTRA_LIBRARY_DIRS=$root\lib" >> $env:GITHUB_ENV
          "COMPRESSO_VCPKG_BIN_DIR=$root\bin" >> $env:GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Build extension
        run: uv pip install -e .

      - name: Bundle dependent DLLs next to the extension
        shell: pwsh
        run: Copy-Item "$env:COMPRESSO_VCPKG_BIN_DIR\*.dll" "src\compresso\" -Force

      - name: Run Python tests
        run: uv run pytest

  # Windows is intentionally absent; the sources under test are portable and
  # are exercised on Windows through the extension by test-python-windows
  test-c:
    name: C tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install C libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libsnappy-dev

      - name: Install C libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd lz4 snappy xz

      # The Unity harness links libpython resolved from the `python3`, so
      # actions/setup-python ships a linkable libpython plus dev headers
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Linux runner's system gem dir is not writable by the build user
      - name: Install rake
        run: ${{ runner.os == 'Linux' && 'sudo gem install rake' || 'gem install rake' }}

      - name: Run C tests
        working-directory: tests/c
        run: rake test:all
