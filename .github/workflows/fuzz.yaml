name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "34 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Grouped by event, so a push to main doesn't cancel the nightly run
concurrency:
  group: fuzz-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (ubuntu-latest, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the targets in tests/c/meson.build
        target: [gzip, bzip2, xz, zstd, lz4, detect, gzip_name]
    env:
      # Short on pushes and PRs, longer on nightly and manual runs
      FUZZ_SECONDS: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 60 || 1800 }}
      # PYTHONMALLOC=malloc lets the per-input leak check see leaked PyObjects;
      # the exit check only sees the harness's never-finalised interpreter
      PYTHONMALLOC: malloc
      ASAN_OPTIONS: leak_check_at_exit=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7

      # libFuzzer's runtime ships in the compiler-rt package matching clang's
      # major version, not with clang itself
      - name: Install C libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            liblz4-dev \
            libsnappy-dev \
            "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Meson
        run: python -m pip install "meson>=1.3.0,<1.13.0" "ninja>=1.11.1,<1.14.0"

      - name: Build fuzz target
        env:
          CC: clang
        run: |
          meson setup build/c-fuzz tests/c -Dfuzz=true -Dwerror=true -Db_sanitize=address,undefined
          meson compile -C build/c-fuzz fuzz_${{ matrix.target }}

      # Prefix-only lookup restores the newest corpus, so coverage accumulates
      # across runs; only main saves, since PRs can read main's caches, but not
      # each other's
      - name: Restore fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # A per-input timeout, since -max_total_time alone never reports a hang;
      # an explicit bash shell sets pipefail, so tee keeps the fuzzer's status
      - name: Run fuzz target
        id: fuzz
        shell: bash
        run: |
          mkdir -p build/fuzz-artifacts build/fuzz-corpus
          build/c-fuzz/fuzz_${{ matrix.target }} -max_total_time=$FUZZ_SECONDS -timeout=10 \
            -artifact_prefix=build/fuzz-artifacts/fuzz_${{ matrix.target }}- \
            build/fuzz-corpus tests/fixtures/interop 2>&1 | tee build/fuzz.log

      # libFuzzer's final cov:/ft: line, collected on the run page so a
      # coverage plateau shows up across nightlies; absent after a crash
      - name: Report coverage
        if: always()
        run: |
          grep -m1 DONE build/fuzz.log | sed 's/^/${{ matrix.target }}: /' >> "$GITHUB_STEP_SUMMARY" || true

      # Keeps only inputs that add coverage, so the cache doesn't grow without
      # bound; the seeds are left out, as every run reads them anyway; the swap
      # only happens if the merge succeeds, so a failure keeps the full corpus
      - name: Minimise fuzz corpus
        if: always() && github.ref == 'refs/heads/main' && steps.fuzz.outcome != 'skipped'
        run: |
          mkdir build/fuzz-corpus-min
          build/c-fuzz/fuzz_${{ matrix.target }} -merge=1 -timeout=10 build/fuzz-corpus-min build/fuzz-corpus
          rm -rf build/fuzz-corpus
          mv build/fuzz-corpus-min build/fuzz-corpus

      # Also after a crash, so that run's progress isn't lost
      - name: Save fuzz corpus
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: build/fuzz-artifacts
