[build-system]
requires = ["meson-python>=0.16.0", "meson>=1.3.0"]
build-backend = "mesonpy"

[project]
name = "compresso"
version = "0.1.0"
description = "A fast C-based Python compression tool supporting multiple algorithms"
authors = [{ name = "Rob Webb" }]
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pygments>=2.20.0",
    "tabulate>=0.9.0,<1.0.0",
    "typer-extensions>=0.3.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
    "meson>=1.3.0,<1.13.0",
    "meson-python>=0.16.0,<0.23.0",
    "ninja>=1.11.1,<1.14.0",
    "prek>=0.5.2,<1.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.16.6,<0.17.0",
    "rust-just>=1.58.0,<2.0.0",
    "ty>=0.0.79,<0.1.0"
]

[project.scripts]
compresso = "compresso.cli:main"
comp = "compresso.cli:main"

[tool.uv]
# The editable install rebuilds on import with the meson and ninja it was built
# with, so they must be the project env's rather than a discarded isolated env's
no-build-isolation-package = ["compresso"]

[tool.ruff.lint.per-file-ignores]
# Every command deliberately ends in a last-resort `except Exception`, so the
# blind-except rule is turned off across the CLI rather than annotated on each
"src/compresso/cli/*.py" = ["BLE001"]
