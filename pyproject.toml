[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compresso"
version = "0.1.0"
description = "A fast C-based Python compression tool supporting multiple algorithms"
authors = [{ name = "Rob Webb" }]
requires-python = ">=3.11"
dependencies = [
    "pygments>=2.20.0",
    "tabulate>=0.9.0,<1.0.0",
    "typer-extensions>=0.3.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
    "prek>=0.5.2,<1.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.16.6,<0.17.0",
    "rust-just>=1.58.0,<2.0.0",
    "setuptools>=84.0.0,<85.0.0",
    "ty>=0.0.79,<0.1.0"
]

[project.scripts]
compresso = "compresso.cli:main"
comp = "compresso.cli:main"

[tool.setuptools.package-data]
compresso = ["py.typed", "*.pyi"]

[tool.ruff.lint.per-file-ignores]
# Every command deliberately ends in a last-resort `except Exception`, so the
# blind-except rule is turned off across the CLI rather than annotated on each
"src/compresso/cli/*.py" = ["BLE001"]
